server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,org.vaadin.demo

# --- Database: in-memory H2, schema from the @Entity classes, seeded by data.sql
spring.datasource.url=jdbc:h2:mem:aishowcase;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# Read-only account (created in data.sql) used for the SQL the LLM writes in the AI grid/chart views
# Same in-memory DB, but without connection settings such as DB_CLOSE_DELAY: H2 allows those only for admins
ai.database.url=jdbc:h2:mem:aishowcase
ai.database.username=AI_READER
ai.database.password=ai-reader

# --- OpenAI via Spring AI. Without OPENAI_API_KEY the app starts and the AI features report themselves disabled.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}
spring.ai.openai.chat.reasoning-effort=${OPENAI_REASONING_EFFORT:low}

# --- draiv (CustomerListView): text presenter drives the live UI through the capability tools
presenter.chat.provider=openai
openai.text.model=${OPENAI_TEXT_MODEL:gpt-5-mini}
openai.text.reasoning-effort=minimal
draiv.tools.surface=capabilities
# Every browser tab is the single demo principal (no logins in this demo)
draiv.session.demo-identity=true
# draiv-ai also brings the Mistral and Anthropic starters; the non-blank placeholders let their model beans
# start keyless (they stay unused while presenter.chat.provider=openai)
spring.ai.mistralai.api-key=${MISTRAL_API_KEY:not-configured}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-configured}
